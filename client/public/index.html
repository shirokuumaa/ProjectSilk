<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="ProjectSilk – virtual try-on, wardrobe & AR/3D fashion"
    />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect to speed up CDNs -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Model Viewer: enables <model-viewer> for GLB/AR preview (SellerPanel, TryOnAvatar, etc.) -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer.min.js">
    </script>
    <script
      nomodule
      src="https://unpkg.com/@google/model-viewer@latest/dist/model-viewer-legacy.js">
    </script>

    <!-- MediaPipe Tasks (HandLandmarker / future AR control) -->
    <script
      defer
      crossorigin="anonymous"
      src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/vision_bundle.js">
    </script>

    <!-- Baseline styles so React pages (canvas, 3D, AR) могут занимать весь экран -->
    <style>
      html, body, #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #ffffff;
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }
    </style>

    <title>ProjectSilk</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
